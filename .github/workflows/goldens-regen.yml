# One-off: regenerate goldens in the CI's own Linux rendering, then publish
# the diff as a patch artifact for the maintainer to apply and commit.
name: goldens regen

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goldens-regen
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.7
  NODE_VERSION: 24.22.1
  DSH_TEST_FONT_DIR: /usr/share/fonts/opentype/noto
  NOTO_CJK_VERSION: 1:20230817+repack1-3
  NOTO_EMOJI_VERSION: v2.051

jobs:
  regen:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Download the fonts
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update -q
          apt-get download fonts-noto-cjk="$NOTO_CJK_VERSION" fonts-noto-cjk-extra="$NOTO_CJK_VERSION"
          for deb in fonts-noto-cjk*.deb; do dpkg-deb -x "$deb" unpacked; done
          sudo install -Dm644 -t "$DSH_TEST_FONT_DIR" unpacked/usr/share/fonts/opentype/noto/NotoSansCJK-{Regular,Bold,Light}.ttc
          curl -fsSL --retry 3 -o ~/NotoColorEmoji.ttf "https://raw.githubusercontent.com/googlefonts/noto-emoji/$NOTO_EMOJI_VERSION/fonts/NotoColorEmoji.ttf"
          echo "72a635cb3d2f3524c51620cdde406b217204e8a6a06c6a096ff8ed4b5fd6e27b  $HOME/NotoColorEmoji.ttf" | sha256sum -c -
          sudo install -Dm644 ~/NotoColorEmoji.ttf /usr/share/fonts/noto/NotoColorEmoji.ttf
      - run: flutter pub get --enforce-lockfile
      - name: Regenerate every golden
        run: flutter test --no-pub --concurrency=4 --update-goldens $(find test -name '*_test.dart')
      - name: Publish the golden diff
        run: |
          cd ..
          git diff --binary > goldens.patch
          git status --short | head -40
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goldens-patch
          path: goldens.patch
          retention-days: 7
