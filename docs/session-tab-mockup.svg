<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E5484D"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A93A6"/>
    </marker>
  </defs>

  <rect width="980" height="640" fill="#F7F8FB"/>
  <text x="490" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1F2430">对话详情页 · 插件页签（placement: session.tab）示意</text>

  <!-- ══════════ 手机 A：聊天页 ══════════ -->
  <text x="210" y="72" text-anchor="middle" font-size="12" fill="#6B7280">① 聊天页：顶栏点「详情」</text>
  <rect x="90" y="86" width="240" height="470" rx="30" fill="#1F2430"/>
  <rect x="98" y="94" width="224" height="454" rx="24" fill="#FFFFFF"/>
  <!-- 状态栏 -->
  <text x="116" y="118" font-size="10" font-weight="600" fill="#1F2430">9:41</text>
  <rect x="288" y="108" width="16" height="8" rx="2" fill="none" stroke="#1F2430" stroke-width="1"/>
  <rect x="290" y="110" width="10" height="4" rx="1" fill="#1F2430"/>
  <!-- 顶栏 -->
  <line x1="98" y1="128" x2="322" y2="128" stroke="#EDF0F4"/>
  <text x="114" y="152" font-size="16" fill="#1F2430">‹</text>
  <text x="138" y="152" font-size="11" font-weight="600" fill="#1F2430">项目重构会话</text>
  <!-- 时钟按钮 -->
  <circle cx="262" cy="148" r="9" fill="none" stroke="#6B7280" stroke-width="1.4"/>
  <path d="M262,143 v5 l3,2" stroke="#6B7280" stroke-width="1.2" fill="none"/>
  <!-- 详情按钮（高亮） -->
  <circle cx="292" cy="148" r="9" fill="none" stroke="#4B67B4" stroke-width="1.4"/>
  <text x="292" y="152" text-anchor="middle" font-size="9" font-weight="700" fill="#4B67B4">i</text>
  <circle cx="292" cy="148" r="15" fill="none" stroke="#E5484D" stroke-width="1.6" stroke-dasharray="3,2"/>
  <!-- 聊天气泡 -->
  <rect x="196" y="172" width="112" height="30" rx="10" fill="#E3EBF9"/>
  <text x="204" y="191" font-size="10" fill="#1F2430">登录页还有 bug？</text>
  <rect x="110" y="212" width="152" height="46" rx="10" fill="#F1F3F6"/>
  <text x="120" y="230" font-size="10" fill="#1F2430">我来复现一下，先跑</text>
  <text x="120" y="246" font-size="10" fill="#1F2430">测试定位问题…</text>
  <rect x="110" y="268" width="178" height="24" rx="8" fill="#EEF2F8"/>
  <text x="120" y="284" font-size="9" fill="#4B67B4">✔ terminal · npm test（3.2s）</text>
  <rect x="110" y="302" width="160" height="40" rx="10" fill="#F1F3F6"/>
  <text x="120" y="319" font-size="10" fill="#1F2430">找到了：表单没校验</text>
  <text x="120" y="334" font-size="10" fill="#1F2430">邮箱格式，我来修</text>
  <!-- 快捷胶囊 -->
  <rect x="110" y="460" width="42" height="20" rx="10" fill="#F1F3F6"/>
  <text x="131" y="474" text-anchor="middle" font-size="9" fill="#1F2430">总结</text>
  <rect x="156" y="460" width="42" height="20" rx="10" fill="#F1F3F6"/>
  <text x="177" y="474" text-anchor="middle" font-size="9" fill="#1F2430">压缩</text>
  <rect x="202" y="460" width="42" height="20" rx="10" fill="none" stroke="#4B67B4" stroke-width="1.2"/>
  <text x="223" y="474" text-anchor="middle" font-size="9" fill="#4B67B4">插件</text>
  <!-- 输入框 -->
  <rect x="110" y="492" width="164" height="34" rx="17" fill="#F1F3F6"/>
  <text x="124" y="513" font-size="9" fill="#9AA3B2">输入消息…</text>
  <circle cx="298" cy="509" r="13" fill="#4B67B4"/>
  <path d="M293,509 h9 M298,504 l4,5 -4,5" stroke="#FFF" stroke-width="1.5" fill="none"/>

  <!-- ①→② 连接箭头 -->
  <path d="M312,148 C 380,148 400,210 448,224" fill="none" stroke="#8A93A6" stroke-width="1.6" marker-end="url(#arrGray)" stroke-dasharray="5,4"/>
  <text x="382" y="186" text-anchor="middle" font-size="11" font-weight="600" fill="#4B67B4">②</text>

  <!-- ══════════ 手机 B：对话详情页（插件页签） ══════════ -->
  <text x="530" y="72" text-anchor="middle" font-size="12" fill="#6B7280">③ 对话详情页 →「插件」页签</text>
  <rect x="430" y="86" width="240" height="470" rx="30" fill="#1F2430"/>
  <rect x="438" y="94" width="224" height="454" rx="24" fill="#F7F8FB"/>
  <text x="456" y="118" font-size="10" font-weight="600" fill="#1F2430">9:41</text>
  <rect x="628" y="108" width="16" height="8" rx="2" fill="none" stroke="#1F2430" stroke-width="1"/>
  <line x1="438" y1="128" x2="662" y2="128" stroke="#EDF0F4"/>
  <text x="454" y="152" font-size="16" fill="#1F2430">‹</text>
  <text x="478" y="152" font-size="11" font-weight="600" fill="#1F2430">对话详情 · 项目重构</text>
  <!-- 页签 -->
  <rect x="452" y="164" width="188" height="28" rx="14" fill="#EDF0F4"/>
  <rect x="456" y="168" width="56" height="20" rx="10" fill="#EDF0F4"/>
  <text x="484" y="182" text-anchor="middle" font-size="10" fill="#6B7280">概览</text>
  <rect x="518" y="168" width="56" height="20" rx="10" fill="#4B67B4"/>
  <text x="546" y="182" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">插件</text>
  <rect x="580" y="168" width="56" height="20" rx="10" fill="#EDF0F4"/>
  <text x="608" y="182" text-anchor="middle" font-size="10" fill="#6B7280">日志</text>

  <!-- 插件卡 1：用量统计 -->
  <rect x="448" y="204" width="204" height="152" rx="12" fill="#FFFFFF" stroke="#E3E7EE"/>
  <text x="460" y="226" font-size="11" font-weight="700" fill="#1F2430">⚡ 用量统计</text>
  <text x="640" y="226" text-anchor="end" font-size="8" fill="#9AA3B2">local-usage · 本会话</text>
  <text x="462" y="262" font-size="22" font-weight="700" fill="#4B67B4">12.4k</text>
  <text x="536" y="262" font-size="9" fill="#6B7280">tokens / 今日</text>
  <!-- 迷你柱状图 -->
  <g fill="#B9C7E4">
    <rect x="462" y="312" width="12" height="18" rx="2"/>
    <rect x="480" y="300" width="12" height="30" rx="2"/>
    <rect x="498" y="318" width="12" height="12" rx="2"/>
    <rect x="516" y="290" width="12" height="40" rx="2"/>
    <rect x="534" y="306" width="12" height="24" rx="2"/>
    <rect x="552" y="296" width="12" height="34" rx="2"/>
  </g>
  <rect x="570" y="282" width="12" height="48" rx="2" fill="#4B67B4"/>
  <line x1="460" y1="330" x2="640" y2="330" stroke="#EDF0F4"/>
  <text x="462" y="346" font-size="8" fill="#9AA3B2">近 7 天 · 今天最高</text>

  <!-- 插件卡 2：待办清单 -->
  <rect x="448" y="366" width="204" height="148" rx="12" fill="#FFFFFF" stroke="#E3E7EE"/>
  <text x="460" y="388" font-size="11" font-weight="700" fill="#1F2430">✅ 待办清单</text>
  <text x="640" y="388" text-anchor="end" font-size="8" fill="#9AA3B2">local-todo</text>
  <circle cx="466" cy="408" r="6" fill="#4B67B4"/>
  <path d="M463,408 l2.5,2.5 4,-5" stroke="#FFF" stroke-width="1.4" fill="none"/>
  <text x="478" y="412" font-size="10" fill="#9AA3B2" text-decoration="line-through">修好登录页校验</text>
  <circle cx="466" cy="428" r="6" fill="none" stroke="#C4CBD6" stroke-width="1.4"/>
  <text x="478" y="432" font-size="10" fill="#1F2430">写接口文档</text>
  <circle cx="466" cy="448" r="6" fill="none" stroke="#C4CBD6" stroke-width="1.4"/>
  <text x="478" y="452" font-size="10" fill="#1F2430">提测前回归</text>
  <rect x="548" y="470" width="92" height="26" rx="13" fill="#4B67B4"/>
  <text x="594" y="487" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">刷新数据</text>

  <!-- ══════════ 右侧说明 ══════════ -->
  <text x="712" y="110" font-size="13" font-weight="700" fill="#1F2430">这张卡片怎么来的？</text>
  <g font-size="11" fill="#3C4456">
    <text x="712" y="140">1. 插件清单声明：</text>
    <text x="726" y="160" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#B0550A">"placement": ["session.tab"]</text>
    <text x="712" y="188">2. App 经 dsh-go-bridge 拉</text>
    <text x="726" y="206" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#0A7D5B">/dsh-go/v1/inventory</text>
    <text x="712" y="234">3. 插件给一棵 JSON 视图树</text>
    <text x="726" y="252" font-size="10" fill="#6B7280">（metric / chart / list / actions…）</text>
    <text x="712" y="280">4. 数据由插件推送，scope 带</text>
    <text x="726" y="298" font-size="10" fill="#6B7280">sessionId → 只统计本会话</text>
    <text x="712" y="326">5. App 用原生组件画出来，</text>
    <text x="726" y="344" font-size="10" fill="#6B7280">不执行插件任何前端代码</text>
  </g>
  <rect x="706" y="366" width="238" height="96" rx="10" fill="#EEF3FB"/>
  <text x="720" y="390" font-size="10.5" font-weight="600" fill="#2B4C8C">同一面板还能出现在：</text>
  <g font-size="10.5" fill="#2B4C8C">
    <text x="720" y="412">· features ——「全部功能」页</text>
    <text x="720" y="432">· chat.panel —— 聊天页「插件」弹层</text>
    <text x="720" y="452">· sidebar —— 侧边栏</text>
  </g>

  <text x="490" y="596" text-anchor="middle" font-size="10" fill="#9AA3B2">示意基于 dsh-go-plugin SKILL.md · 卡片内容为虚构示例 · 插件只在装了 dsh-go 桥接的主机上显示</text>
</svg>
