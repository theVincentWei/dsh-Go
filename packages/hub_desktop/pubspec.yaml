name: hub_desktop
description: >-
  「小程序」桌面引擎包:分组画布、拖拽整理、最近使用、声明式角标。引擎只认
  抽象模型(HubTile/HubIcon/HubBadge),目录、文案、打开/卸载回调由宿主
  (dsh-go)注入;布局持久化沿用 SharedPreferences 的 hub.layout.v1。
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
